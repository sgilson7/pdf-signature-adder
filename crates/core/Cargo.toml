[package]
name = "tool_core"
version = "0.1.0"
edition = "2021"
description = "Every application rule of the tool. No input or output."
publish = false

# The allowlist for this crate is ALLOWED_DEPENDENCIES in tests/boundary.rs.
# Adding a dependency here without adding it there fails `cargo test`.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PS-Q3 (2026-10-19): Flate for object streams and for what the update writes.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
